name: Build Runrunrun APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q runrunrun-source-public.zip -d project

      - name: Build installable debug APK
        shell: bash
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../runrunrun.apk
          sha256sum ../runrunrun.apk | tee ../runrunrun.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: runrunrun-android-apk
          path: |
            runrunrun.apk
            runrunrun.apk.sha256
          if-no-files-found: error
          retention-days: 30
