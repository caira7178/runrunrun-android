name: Build Signed Runrunrun Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUNRUNRUN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUNRUNRUN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RUNRUNRUN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing RUNRUNRUN_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RUNRUNRUN_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RUNRUNRUN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RUNRUNRUN_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUNRUNRUN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/runrunrun-release.jks"

      - name: Unpack project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q runrunrun-source-public.zip -d project
          cp "$RUNNER_TEMP/runrunrun-release.jks" "$GITHUB_WORKSPACE/project/runrunrun-release.jks"

      - name: Build signed release APK
        shell: bash
        working-directory: project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/project/runrunrun-release.jks
          STORE_FILE: ${{ github.workspace }}/project/runrunrun-release.jks
          RELEASE_STORE_FILE: ${{ github.workspace }}/project/runrunrun-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUNRUNRUN_KEY_ALIAS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RUNRUNRUN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RUNRUNRUN_KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RUNRUNRUN_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PSTORE_FILE="$STORE_FILE" \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PSTORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$(find project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK" || { echo "Release APK not found"; find project/app/build/outputs -maxdepth 5 -type f -print || true; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" runrunrun-release.apk
          sha256sum runrunrun-release.apk | tee runrunrun-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: runrunrun-signed-release-apk
          path: |
            runrunrun-release.apk
            runrunrun-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
