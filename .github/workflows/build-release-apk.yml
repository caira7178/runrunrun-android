name: Build Signed Runrunrun Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUNRUNRUN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUNRUNRUN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RUNRUNRUN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing RUNRUNRUN_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RUNRUNRUN_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RUNRUNRUN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RUNRUNRUN_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUNRUNRUN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/runrunrun-release.jks"

      - name: Unpack project and disable Gradle release signing
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q runrunrun-source-public.zip -d project

          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ("build.gradle", "build.gradle.kts"):
              p = Path("project/app") / name
              if not p.exists():
                  continue
              lines = p.read_text(encoding="utf-8").splitlines(True)
              out = []
              for line in lines:
                  s = line.strip()
                  # Remove only the line that assigns a signing config to a build type.
                  # Keep the signingConfigs { ... } declaration itself untouched.
                  if re.search(r"\bsigningConfig\b", s) and not re.search(r"\bsigningConfigs\b", s):
                      print("Removed:", s)
                      continue
                  out.append(line)
              p.write_text("".join(out), encoding="utf-8")
          PY

      - name: Build unsigned release APK
        shell: bash
        working-directory: project
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Sign release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RUNRUNRUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUNRUNRUN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RUNRUNRUN_KEY_PASSWORD }}
        run: |
          APK="$(find project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK" || { echo "Release APK not found"; find project/app/build/outputs -maxdepth 5 -type f -print || true; exit 1; }

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" runrunrun-release-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/runrunrun-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out runrunrun-release.apk \
            runrunrun-release-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs runrunrun-release.apk
          sha256sum runrunrun-release.apk | tee runrunrun-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: runrunrun-signed-release-apk
          path: |
            runrunrun-release.apk
            runrunrun-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
